ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry supplies forward velocity and yaw rate. Using velocity here
    # avoids fusing its integrated pose alongside absolute LiDAR pose.
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5
    odom0_twist_rejection_threshold: 3.0

    # The launch file may add odom1 for LiDAR planar pose (x, y, yaw).

    imu0: /imu/data
    # A 6-axis IMU has angular velocity and linear acceleration, but no
    # absolute heading reference. Fuse yaw rate and planar acceleration only.
    imu0_config: [false, false, false,
            false, false, false,
            false, false, false,
            false, false, true,
            true,  true,  false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_twist_rejection_threshold: 2.0
    imu0_linear_acceleration_rejection_threshold: 2.0
    imu0_remove_gravitational_acceleration: false

    process_noise_covariance: [0.05, 0.05, 0.06, 0.03, 0.03,
                               0.06, 0.025, 0.025, 0.04, 0.01,
                               0.01, 0.02, 0.01, 0.01, 0.015]
    initial_estimate_covariance: [1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9,
                                  1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9,
                                  1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9]
