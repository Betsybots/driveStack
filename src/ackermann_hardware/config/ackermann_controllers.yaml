controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    bicycle_steering_controller:
      type: bicycle_steering_controller/BicycleSteeringController

bicycle_steering_controller:
  ros__parameters:
    # One traction joint (the solid rear axle) and one steering joint at the front.
    front_steering: true
    rear_wheels_names: [rear_wheel_joint]
    front_wheels_names: [steering_joint]

    wheelbase: 0.31115          # m, front axle to rear axle
    rear_wheel_radius: 0.066675  # m, traction wheel
    front_wheel_radius: 0.066675  # m

    # Accept plain geometry_msgs/Twist on ~/reference_unstamped (teleop_twist_joy, Nav2 on Humble).
    use_stamped_vel: false
    # Stop if no command arrives for this long.
    reference_timeout: 0.5
    # Odometry from the measured wheel velocity and the estimated steering angle.
    open_loop: false
    position_feedback: false

    odom_frame_id: odom
    base_frame_id: base_footprint
    # Leave odom -> base_footprint to the localization stack; set true if nothing else publishes it.
    enable_odom_tf: false

    pose_covariance_diagonal: [0.001, 0.001, 0.000001, 0.000001, 0.000001, 0.05]
    twist_covariance_diagonal: [0.001, 0.000001, 0.000001, 0.000001, 0.000001, 0.25]
