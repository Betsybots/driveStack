# teleop_twist_joy for a Logitech F710 in D mode. Check indices with: ros2 topic echo /joy
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 4          # right stick up/down -> forward/back (m/s)
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.0
    axis_angular:
      yaw: 3        # right stick left/right -> yaw rate (rad/s)
    scale_angular:
      yaw: 1.0
    scale_angular_turbo:
      yaw: 2.0
    # Hold RB to drive, add LB for turbo.
    require_enable_button: true
    enable_button: 5
    enable_turbo_button: 4
